apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-event-relay
  labels:
    app.kubernetes.io/name: payment-event-relay
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment-event-relay
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # avoid flapping after a burst
