# Default-deny for this app, then allow only what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payment-event-relay
  labels:
    app.kubernetes.io/name: payment-event-relay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-event-relay
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:   # API traffic from the ingress controller / API gateway
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        # metrics scraping
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:     # DNS
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:     # PostgreSQL
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payments-db
      ports:
        - port: 5432
          protocol: TCP
    - ports:  # fraud vendor over HTTPS (tighten to the vendor's CIDR / an egress gateway in prod)
        - port: 443
          protocol: TCP
