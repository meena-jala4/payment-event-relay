apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-event-relay
  labels:
    app.kubernetes.io/name: payment-event-relay
    app.kubernetes.io/part-of: payments
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-event-relay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never drop below desired capacity during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-event-relay
        app.kubernetes.io/part-of: payments
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: payment-event-relay
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-event-relay
      containers:
        - name: app
          image: registry.example.com/payments/payment-event-relay:latest  # pinned per env by kustomize
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: payment-event-relay-config
          env:
            # Credentials come from a Secret that is created out-of-band (External Secrets / Vault),
            # never committed. See docs/secret.example.yaml for its shape.
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-event-relay-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-event-relay-secrets
                  key: db-password
            - name: FRAUD_PROVIDER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: payment-event-relay-secrets
                  key: fraud-provider-api-key
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 768Mi
          startupProbe:          # JVM start can be slow; don't let liveness kill it while booting
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:         # "is the process wedged?" - deliberately excludes DB/vendor health
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:        # "should I get traffic?"
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:             # give the load balancer time to stop routing before shutdown starts
              exec:
                command: ["sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
