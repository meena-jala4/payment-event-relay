# Optional: run against PostgreSQL (closer to prod) with `docker compose up --build`.
# The normal `./mvnw spring-boot:run` uses H2 and doesn't need any of this.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay-local-only   # local-only password, not a real secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d payments"]
      interval: 2s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payments
      DB_USERNAME: relay
      DB_PASSWORD: relay-local-only
      FRAUD_STUB_FAILURE_RATE: "0.3"
    depends_on:
      postgres:
        condition: service_healthy
